<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Sign in · VPN switcher</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='6' fill='%230f6b4c'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="narrow">
    <p class="eyebrow">VPN switcher</p>
    <h1>Sign in</h1>
    <p class="muted">The password is the one whose hash is in this app's configuration.</p>
    {% if error %}
    <p class="banner error" role="alert">{{ error }}</p>
    {% endif %}
    <form method="post" action="/login" class="stack">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <label class="field">
        <span>Password</span>
        <input type="password" name="password" autocomplete="current-password" autocapitalize="none" autocorrect="off" required autofocus>
      </label>
      <button type="submit" class="primary">Sign in</button>
    </form>
  </main>
</body>
</html>
